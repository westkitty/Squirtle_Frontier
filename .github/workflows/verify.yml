name: Verify Squirtle Frontier

on:
  push:
    branches: [main, phase3-water-jet-intent]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BROWSER_BUNDLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare evidence directories
        run: mkdir -p artifacts/shoreline

      - name: Validate assets
        run: npm run assets

      - name: Architecture and unit checks
        run: npm run check

      - name: Mutation suite
        run: npm run mutate

      - name: Production build
        id: production-build
        if: always()
        run: npm run build

      - name: Browser journeys, performance, and shoreline proof
        if: ${{ always() && steps.production-build.outcome == 'success' }}
        shell: bash
        run: |
          npm run start -- --host 127.0.0.1 > /tmp/squirtle-frontier-vite.log 2>&1 &
          VITE_PID=$!
          cleanup() {
            cp /tmp/squirtle-frontier-vite.log artifacts/vite.log 2>/dev/null || true
            kill "$VITE_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5173/ >/dev/null
          FAIL=0
          run_check() {
            NAME="$1"
            shift
            echo "::group::$NAME"
            if "$@"; then
              echo "$NAME passed"
            else
              echo "::error::$NAME failed"
              FAIL=1
            fi
            echo "::endgroup::"
          }
          run_check "Core movement" npm run browser
          run_check "Habitat" npm run browser:habitat
          run_check "World" npm run browser:world
          run_check "Recovery" npm run browser:recovery
          run_check "Channel" npm run browser:channel
          run_check "Wildlife" npm run browser:wildlife
          run_check "Squirtle population" npm run browser:squirtles
          run_check "Accessibility" npm run browser:a11y
          run_check "Gamepad" npm run browser:gamepad
          run_check "Multitab" npm run browser:multitab
          run_check "Watershed" npm run browser:watershed
          run_check "Performance" npm run perf
          run_check "Shoreline capture" node tools/shoreline-capture.mjs
          exit "$FAIL"

      - name: Built-bundle browser journey
        if: ${{ always() && steps.production-build.outcome == 'success' }}
        run: npm run browser:dist

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: squirtle-frontier-validation
          path: |
            artifacts/
            docs/qa/
            docs/performance/
          if-no-files-found: warn
