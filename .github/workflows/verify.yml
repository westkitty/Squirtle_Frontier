name: Verify Squirtle Frontier

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BROWSER_BUNDLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare evidence directories
        run: mkdir -p artifacts/shoreline

      - name: Validate assets
        run: npm run assets

      - name: Architecture and unit checks
        run: npm run check

      - name: Mutation suite
        run: npm run mutate

      - name: Production build
        run: npm run build

      - name: Browser journeys, performance, and shoreline proof
        shell: bash
        run: |
          npm run start -- --host 127.0.0.1 > /tmp/squirtle-frontier-vite.log 2>&1 &
          VITE_PID=$!
          cleanup() {
            cp /tmp/squirtle-frontier-vite.log artifacts/vite.log 2>/dev/null || true
            kill "$VITE_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5173/ >/dev/null
          npm run browser
          npm run browser:habitat
          npm run browser:world
          npm run browser:recovery
          npm run browser:channel
          npm run browser:wildlife
          npm run browser:a11y
          npm run browser:multitab
          npm run browser:watershed
          npm run perf
          node tools/shoreline-capture.mjs

      - name: Built-bundle browser journey
        run: npm run browser:dist

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: squirtle-frontier-validation
          path: |
            artifacts/
            docs/qa/
            docs/performance/
          if-no-files-found: warn
