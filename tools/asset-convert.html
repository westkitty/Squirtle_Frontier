<!doctype html>
<html>
  <body>
    <script type="module">
      import * as THREE from "three";
      import { ColladaLoader } from "three/addons/loaders/ColladaLoader.js";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { GLTFExporter } from "three/addons/exporters/GLTFExporter.js";
      window.convert = async function () {
        let loaded;
        const ready = new Promise((resolve) => {
          loaded = resolve;
        });
        const manager = new THREE.LoadingManager(loaded);
        const dae = await new ColladaLoader(manager).loadAsync(
          "/.asset-work/Squirtle_OpenCollada.DAE",
        );
        await ready;
        const root = new THREE.Group();
        root.name = "PlayablePresentation";
        root.add(dae.scene);
        dae.scene.traverse((o) => {
          if (o.isLight || o.isCamera) o.visible = false;
          if (o.isMesh) {
            const uv = o.geometry.getAttribute("uv");
            if (uv && uv.itemSize !== 2) {
              const flat = new Float32Array(uv.count * 2);
              for (let i = 0; i < uv.count; i++) {
                flat[i * 2] = uv.getX(i);
                flat[i * 2 + 1] = uv.getY(i);
              }
              o.geometry.setAttribute("uv", new THREE.BufferAttribute(flat, 2));
            }
            o.material = (
              Array.isArray(o.material) ? o.material : [o.material]
            ).map((m) => {
              if (m.map) m.map.colorSpace = THREE.SRGBColorSpace;
              return new THREE.MeshStandardMaterial({
                name: m.name,
                map: m.map,
                roughness: 0.85,
                metalness: 0,
              });
            });
          }
        });
        root.updateMatrixWorld(true);
        root.traverse((o) => o.skeleton?.update());
        const box = new THREE.Box3().setFromObject(root, true),
          size = box.getSize(new THREE.Vector3());
        root.scale.setScalar(0.55 / size.y);
        root.updateMatrixWorld(true);
        const scaled = new THREE.Box3().setFromObject(root, true);
        const center = scaled.getCenter(new THREE.Vector3());
        root.position.set(-center.x, -scaled.min.y, -center.z);
        root.updateMatrixWorld(true);
        const binary = await new GLTFExporter().parseAsync(root, {
          binary: true,
          onlyVisible: true,
        });
        const round = await new GLTFLoader().parseAsync(binary, "");
        const info = (obj) => {
          obj.updateMatrixWorld(true);
          obj.traverse((o) => o.skeleton?.update());
          const b = new THREE.Box3().setFromObject(obj, true);
          let meshes = [],
            bones = [];
          obj.traverse((o) => {
            if (o.isBone)
              bones.push({
                name: o.name,
                position: o.getWorldPosition(new THREE.Vector3()).toArray(),
              });
            if (o.isMesh)
              meshes.push({
                name: o.name,
                vertices: o.geometry.attributes.position.count,
                groups: o.geometry.groups,
                skinned: !!o.skeleton,
              });
          });
          return { min: b.min.toArray(), max: b.max.toArray(), meshes, bones };
        };
        const result = {
          source: info(root),
          roundtrip: info(round.scene),
          animations: round.animations.length,
          bytes: binary.byteLength,
        };
        window.source = root;
        window.runtime = round.scene;
        return { bytes: Array.from(new Uint8Array(binary)), report: result };
      };
    </script>
  </body>
</html>
